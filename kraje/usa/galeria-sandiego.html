<!-- LIGHTBOX -->
<div id="lightbox" class="lightbox">
    <span class="close">&times;</span>
    <img class="lightbox-img" src="">

    <div class="lightbox-info">
        <div class="lightbox-caption"></div>
        <div class="lightbox-counter"></div>
    </div>

    <div class="lightbox-nav">
        <span class="prev">&#10094;</span>
        <span class="next">&#10095;</span>
    </div>
</div>
<script>
const images = document.querySelectorAll('.gallery-grid img');
const lightbox = document.getElementById('lightbox');
const lightboxImg = document.querySelector('.lightbox-img');
const closeBtn = document.querySelector('.close');
const prevBtn = document.querySelector('.prev');
const nextBtn = document.querySelector('.next');

const counter = document.querySelector('.lightbox-counter');
const caption = document.querySelector('.lightbox-caption');

let currentIndex = 0;

// ⭐ TWOJE PODPISY – ZACHOWANE 1:1 ⭐
const captions = [
    "San Diego – Zdjęcie 1",
    "San Diego – Zdjęcie 2",
    "San Diego – Zdjęcie 3",
    "San Diego – Zdjęcie 4",
    "San Diego – Zdjęcie 5",
    "San Diego – Zdjęcie 6",
    "San Diego – Zdjęcie 7",
    "San Diego – Zdjęcie 8",
    "San Diego – Zdjęcie 9",
    "San Diego – Zdjęcie 10",
    "San Diego – Zdjęcie 11",
    "San Diego – Zdjęcie 12",
    "San Diego – Zdjęcie 13",
    "San Diego – Zdjęcie 14",
    "San Diego – Zdjęcie 15",
    "San Diego – Zdjęcie 16",
    "San Diego – Zdjęcie 17",
    "San Diego – Zdjęcie 18",
    "San Diego – Zdjęcie 19",
    "San Diego – Zdjęcie 20"
];

function updateLightbox() {
    lightboxImg.src = images[currentIndex].src;
    counter.textContent = `${currentIndex + 1} / ${images.length}`;
    caption.textContent = captions[currentIndex] || "";
}

function openLightbox(index) {
    currentIndex = index;
    updateLightbox();
    lightbox.style.display = 'flex';
    lightbox.classList.add('show');
}

function closeLightbox() {
    lightbox.classList.remove('show');
    setTimeout(() => lightbox.style.display = 'none', 200);
}

function nextImage() {
    currentIndex = (currentIndex + 1) % images.length;
    updateLightbox();
}

function prevImage() {
    currentIndex = (currentIndex - 1 + images.length) % images.length;
    updateLightbox();
}

// Kliknięcia w miniatury
images.forEach((img, index) => {
    img.addEventListener('click', () => openLightbox(index));
});

// Przyciski
closeBtn.addEventListener('click', closeLightbox);
nextBtn.addEventListener('click', nextImage);
prevBtn.addEventListener('click', prevImage);

// Kliknięcie w tło
lightbox.addEventListener('click', (e) => {
    if (e.target === lightbox) closeLightbox();
});

// ⭐ OBSŁUGA KLAWIATURY ⭐
document.addEventListener('keydown', (e) => {
    if (!lightbox.classList.contains('show')) return;

    if (e.key === 'ArrowRight') nextImage();
    else if (e.key === 'ArrowLeft') prevImage();
    else if (e.key === 'Escape') closeLightbox();
});
</script>
