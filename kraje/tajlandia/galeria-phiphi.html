<!-- LIGHTBOX -->
<div id="lightbox" class="lightbox">
    <span class="close">&times;</span>
    <img class="lightbox-img" src="">

    <div class="lightbox-info">
        <div class="lightbox-caption"></div>
        <div class="lightbox-counter"></div>
    </div>

    <div class="lightbox-nav">
        <span class="prev">&#10094;</span>
        <span class="next">&#10095;</span>
    </div>
</div>
<script>
const images = document.querySelectorAll('.gallery-grid img');
const lightbox = document.getElementById('lightbox');
const lightboxImg = document.querySelector('.lightbox-img');
const closeBtn = document.querySelector('.close');
const prevBtn = document.querySelector('.prev');
const nextBtn = document.querySelector('.next');

const counter = document.querySelector('.lightbox-counter');
const caption = document.querySelector('.lightbox-caption');

let currentIndex = 0;

// ⭐ TWOJE PODPISY — ZACHOWANE 1:1 ⭐
const captions = [
    "Phi Phi – Viewpoint nr 2",
    "Phi Phi – Maya Bay",
    "Phi Phi – Zachód Słońca",
    "Phi Phi – Viewpoint nr 2",
    "Phi Phi – Hong Island",
    "Phi Phi – Longbeach",
    "Phi Phi – Longbeach",
    "Phi Phi – Rybki przy Longbeach",
    "Phi Phi – Longbeach",
    "Phi Phi – Pileh Lagoon",
    "Phi Phi – Longbeach",
    "Phi Phi – Longbeach",
    "Phi Phi – Viewpoint nr 2",
    "Phi Phi – Phi Phi Village",
    "Phi Phi – Bamboo Island",
    "Phi Phi – Bamboo Island",
    "Phi Phi – Maya Beach",
    "Phi Phi – Monkey Island",
    "Phi Phi – Pokaz Ogni",
    "Phi Phi – Widok z hotelu"
];

function updateLightbox() {
    lightboxImg.src = images[currentIndex].src;
    counter.textContent = `${currentIndex + 1} / ${images.length}`;
    caption.textContent = captions[currentIndex] || "";
}

function openLightbox(index) {
    currentIndex = index;
    updateLightbox();
    lightbox.style.display = 'flex';
    lightbox.classList.add('show');
}

function closeLightbox() {
    lightbox.classList.remove('show');
    setTimeout(() => lightbox.style.display = 'none', 200);
}

function nextImage() {
    currentIndex = (currentIndex + 1) % images.length;
    updateLightbox();
}

function prevImage() {
    currentIndex = (currentIndex - 1 + images.length) % images.length;
    updateLightbox();
}

// Kliknięcia w miniatury
images.forEach((img, index) => {
    img.addEventListener('click', () => openLightbox(index));
});

// Przyciski
closeBtn.addEventListener('click', closeLightbox);
nextBtn.addEventListener('click', nextImage);
prevBtn.addEventListener('click', prevImage);

// Kliknięcie w tło
lightbox.addEventListener('click', (e) => {
    if (e.target === lightbox) closeLightbox();
});

// ⭐ OBSŁUGA KLAWIATURY ⭐
document.addEventListener('keydown', (e) => {
    if (!lightbox.classList.contains('show')) return;

    if (e.key === 'ArrowRight') nextImage();
    else if (e.key === 'ArrowLeft') prevImage();
    else if (e.key === 'Escape') closeLightbox();
});
</script>
